<!DOCTYPE html>
<html lang="en">
  <!--
    ==============================================================================
    HTML Entry Document (index.html)
    ==============================================================================
    WHAT IS THIS FILE?
    This is the foundational HTML page loaded by a web browser whenever someone
    visits hilpatel.site. It sets up the webpage title, icons (favicons), fonts,
    and the HTML container where React will draw all visual components.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hil Patel — Data Analyst Portfolio</title>
    <meta name="description" content="Portfolio of Hil Patel, Data Analyst and Computer Engineering graduate specializing in Python, SQL, Power BI, DAX, and Business Intelligence." />

    <!-- Favicon & Brand Icons: Shows the HP brand logo in browser tabs and mobile bookmarks -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Web Fonts: Preconnecting allows the browser to download fonts faster -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!--
      Theme Anti-Flash Script:
      Runs synchronously immediately before the page is drawn. It checks if the visitor
      previously picked dark or light mode (stored in a cookie or localStorage) or prefers
      dark mode on their device. By setting 'data-theme' before rendering, we prevent an
      annoying bright white flash when visiting the site in dark mode.
    -->
    <script>
      (function() {
        try {
          var getCookie = function(name) {
            var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
            return m ? decodeURIComponent(m[1]).trim().toLowerCase() : null;
          };
          var t = getCookie('site-theme') || getCookie('hil_theme');
          if (t !== 'light' && t !== 'dark') {
            try {
              t = (localStorage.getItem('site-theme') || localStorage.getItem('hil-theme') || '').trim().toLowerCase();
            } catch (e) {}
          }
          if (t !== 'light' && t !== 'dark') {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              t = 'dark';
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
              t = 'light';
            } else {
              t = 'light';
            }
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <!-- React Mount Point: React finds this div by its id="root" and renders the entire site inside it -->
    <div id="root"></div>

    <!-- Loads the JavaScript code that starts up the React application -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
